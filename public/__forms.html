<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify form detection</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <!--
    This page exists only so Netlify can register the contact form at deploy
    time. Netlify's form parser does not reliably read framework-generated
    markup, so it reads this plain HTML copy instead. The real form that
    visitors use is in components/ContactForm.tsx.

    The field names here MUST match the ones in ContactForm.tsx.
  -->
  <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="text" name="topic">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
